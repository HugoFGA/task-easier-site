<!DOCTYPE html>
<!-- Arquivo: app.html | Versão: 11 (Task Easier — versão mobile/web, fora da extensão) -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4511E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon128.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Task Easier</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#1a73e8;--blue-dk:#1557b0;--blue-lt:#e8f0fe;
    --red:#d93025;--green:#188038;--orange:#F4511E;
    --text:#202124;--sec:#5f6368;--border:#dadce0;
    --bg:#f8f9fa;--white:#fff;
    --focus-ring:rgba(26,115,232,.15);
    --overlay-bg:rgba(255,255,255,.75);
  }
  :root[data-theme="dark"]{
    --blue:#8ab4f8;--blue-dk:#8ab4f8;--blue-lt:rgba(138,180,248,.18);
    --red:#f28b82;--green:#81c995;--orange:#ff7043;
    --text:#e8eaed;--sec:#9aa0a6;--border:#3c4043;
    --bg:#161719;--white:#242528;
    --focus-ring:rgba(138,180,248,.25);
    --overlay-bg:rgba(36,37,40,.85);
  }
  html,body{font-family:-apple-system,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);overscroll-behavior-y:contain}
  body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}

  /* A página rola normalmente (scroll nativo do navegador) — o topo e o
     rodapé ficam "grudados" com position:sticky, muito mais confiável
     entre celulares do que tentar rolar só uma div interna. */
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;min-height:100vh}
  .fixed-top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:20px}
  .top-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{width:36px;height:36px;border-radius:9px;flex-shrink:0}
  .top-bar h1{font-size:18px;white-space:nowrap;flex:1}
  .top-actions{display:flex;align-items:center;gap:8px}
  .coffee-btn-top{display:inline-flex;align-items:center;gap:3px;background:#FFDD00;color:#1c1c1c;font-weight:600;font-size:11px;padding:5px 9px;border-radius:14px;text-decoration:none;white-space:nowrap}
  .lang-switch{display:flex;gap:2px}
  .lang-btn{background:transparent;border:none;cursor:pointer;font-size:20px;line-height:1;padding:3px;border-radius:4px;opacity:.4;filter:grayscale(60%)}
  .lang-btn.active{opacity:1;filter:none}
  .install-btn{background:var(--orange);color:#fff;border:none;cursor:pointer;font-size:15px;line-height:1;padding:5px 7px;border-radius:14px}
  .install-btn:active{opacity:.85}
  .icon-btn{background:transparent;border:none;cursor:pointer;font-size:18px;line-height:1;padding:3px 5px;border-radius:4px;color:var(--text)}
  .icon-btn:active{background:var(--border)}

  .hidden{display:none!important}

  /* Balões flutuantes: "Tarefa/Evento criado" (centro, azul/vermelho) e
     "Desfazer" (direita, verde) — maiores, para chamar mais atenção. */
  .balloon{position:fixed;z-index:100;color:#fff;font-weight:700;font-size:15px;padding:12px 22px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:78vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;top:12px}
  #qa-toast{left:50%;transform:translateX(-50%)}
  #qa-toast.ok{background:var(--blue)}
  #qa-toast.err{background:var(--red)}
  #undo-balloon{right:10px;background:var(--green);cursor:pointer}

  /* ── LOGIN ── */
  .login-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 8px}
  .login-screen p{color:var(--sec);font-size:15px;max-width:320px}
  .signin-btn{display:inline-flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:24px;padding:12px 22px;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .signin-btn:active{background:var(--bg)}
  .login-error{color:var(--red);font-size:13px;max-width:320px}

  /* ── FORM (fica dentro da parte fixa/sticky) ── */
  .quick-form{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .ctrl{padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);background:var(--white);outline:none;width:100%}
  .ctrl:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring)}
  .row{display:flex;gap:8px;align-items:center}
  .row .ctrl{flex:1}
  .ctrl-auto{width:auto;flex:0 0 auto;min-width:0}
  .type-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;white-space:nowrap}
  .type-toggle-icon{opacity:.5;font-size:13px}
  .color-block{width:30px;height:30px;flex-shrink:0;border-radius:8px;cursor:pointer;border:1px solid var(--border)}
  .color-popover{position:fixed;z-index:200;background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .color-popover .swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center}
  .color-popover .swatch.selected{border-color:var(--text)}
  .color-popover .swatch svg{width:16px;height:16px;color:#fff;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}

  /* Notas: itálico e mais claro — mesmo estilo tanto no texto digitado
     quanto no placeholder, para deixar claro que é um campo secundário. */
  #qa-notes{font-style:italic;color:var(--sec)}
  #qa-notes::placeholder{font-style:italic;color:var(--sec);opacity:.8}

  /* Botão de adicionar — abaixo de todo o formulário, com o ícone padrão do app */
  .qa-add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--orange);color:#fff;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:2px}
  .qa-add-btn img{width:20px;height:20px;border-radius:5px;flex-shrink:0}
  .qa-add-btn:active{opacity:.85}
  .qa-add-btn:disabled{opacity:.6;cursor:default}

  /* ── LISTA (rola junto com a página; só o topo e o rodapé ficam fixos) ── */
  .tasks-view{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
  .tasks-list{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .task-item{border-bottom:1px solid var(--border)}
  .task-item:last-child{border-bottom:none}
  .task-row{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px}
  .task-color-bar{width:5px;align-self:stretch;border-radius:3px;flex-shrink:0;background:var(--border)}
  .task-row input[type=checkbox]{width:19px;height:19px;flex-shrink:0;accent-color:var(--green)}
  .task-row .task-col-notes{flex:1;min-width:0;color:var(--text);word-break:break-word;cursor:pointer}
  .task-row.done .task-col-notes{text-decoration:line-through;color:var(--sec)}
  .task-expand-icon{color:var(--sec);font-size:12px;flex-shrink:0;padding:0 2px}
  .task-del-btn{background:transparent;border:none;cursor:pointer;color:var(--sec);flex-shrink:0;padding:6px;border-radius:6px;display:flex;align-items:center}
  .task-del-btn:active{background:var(--bg)}
  #tasks-empty,#tasks-loading{font-size:14px;color:var(--sec);text-align:center;padding:24px 0}

  /* Linha expandida: campos editáveis + ações de salvar/copiar */
  .task-details{display:flex;flex-direction:column;gap:8px;padding:4px 12px 14px}
  .detail-row{display:flex;gap:8px}
  .detail-row .ctrl{font-size:14px;padding:9px 10px}
  .detail-notes{font-style:italic;color:var(--sec)}
  .detail-btn{flex:1;padding:9px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer}
  .detail-btn.save-btn{background:var(--orange);color:#fff}
  .detail-btn.copy-btn{background:var(--border);color:var(--text)}
  .detail-btn:disabled{opacity:.6}

  /* ── RODAPÉ FIXO: caixa de busca ── */
  .fixed-bottom{position:sticky;bottom:0;z-index:10;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:4px}
  #search-input{font-style:normal}

  .app-version{position:fixed;right:8px;bottom:6px;font-size:10px;color:var(--sec);opacity:.55;pointer-events:none;z-index:40;background:var(--overlay-bg);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="fixed-top">
    <div class="top-bar">
      <img class="logo" src="icon128.png" alt="Task Easier">
      <h1>Task Easier</h1>
      <div class="top-actions">
        <button type="button" id="install-btn" class="install-btn hidden" title="Instalar no celular" aria-label="Instalar no celular">📲</button>
        <button type="button" id="theme-btn" class="icon-btn" title="Alternar tema" aria-label="Alternar tema">🌙</button>
        <button type="button" id="peek-btn" class="icon-btn hidden" title="Ver tudo" aria-label="Ver tudo">😊</button>
        <a class="coffee-btn-top" href="https://buymeacoffee.com/hugofga" target="_blank" rel="noopener">☕ <span data-i18n="coffee_text_short">Apoie</span></a>
        <div class="lang-switch">
          <button type="button" class="lang-btn" data-lang="pt" title="Português" aria-label="Português">🇧🇷</button>
          <button type="button" class="lang-btn" data-lang="en" title="English" aria-label="English">🇺🇸</button>
        </div>
      </div>
    </div>

    <!-- Formulário: fica preso no topo junto com a barra acima -->
    <div id="quick-form-wrap" class="hidden">
      <form id="quick-form" class="quick-form">
        <input type="text" id="qa-title" class="ctrl" placeholder="Título..." autocomplete="off" required data-i18n-placeholder="ph_title">

        <div class="row">
          <button type="button" id="qa-type-toggle" class="ctrl ctrl-auto type-toggle" aria-label="Tipo">
            <span id="qa-type-label">Tarefa</span><span class="type-toggle-icon">⇄</span>
          </button>
          <input type="date" id="qa-date" class="ctrl ctrl-auto">
          <div id="qa-color-block" class="color-block hidden" title="Cor do evento" data-i18n-title="label_event_color"></div>
        </div>

        <input type="text" id="qa-notes" class="ctrl" placeholder="Notas (opcional)" autocomplete="off" data-i18n-placeholder="notes_placeholder">

        <button type="submit" id="qa-add-btn" class="qa-add-btn" data-i18n-title="btn_add_title" aria-label="Adicionar">
          <img src="icon128.png" alt="">
          <span data-i18n="btn_add_title">Adicionar</span>
        </button>
      </form>
    </div>
  </div>

  <div id="login-screen" class="login-screen">
    <p data-i18n="login_intro">Entre com sua conta Google para gerenciar suas tarefas do Google Tasks e eventos do Google Calendar.</p>
    <button type="button" id="signin-btn" class="signin-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l6-6C34.5 5.9 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l6-6C34.5 5.9 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.4C41.9 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      <span data-i18n="signin_btn">Entrar com o Google</span>
    </button>
    <p id="login-error" class="login-error hidden"></p>
  </div>

  <!-- Lista: rola junto com a página (o topo acima é que fica fixo) -->
  <div id="tasks-view" class="tasks-view hidden">
    <p id="tasks-loading" data-i18n="tasks_loading">Carregando tarefas…</p>
    <p id="tasks-empty" class="hidden" data-i18n="tasks_empty">Nenhuma tarefa ou evento</p>
    <div id="tasks-list" class="tasks-list hidden"></div>
  </div>

  <!-- Busca: fica presa no rodapé -->
  <div id="fixed-bottom" class="fixed-bottom hidden">
    <input type="search" id="search-input" class="ctrl" placeholder="🔍 Buscar tarefas e eventos..." autocomplete="off" data-i18n-placeholder="search_placeholder">
  </div>
</div>

<div id="qa-toast" class="balloon hidden"></div>
<div id="undo-balloon" class="balloon hidden"></div>
<div class="app-version" id="app-version"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="gis-shim.js"></script>
<script src="app-mobile.js"></script>
</body>
</html>
